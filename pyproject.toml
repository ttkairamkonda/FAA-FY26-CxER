[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "faa-cxer"
version = "0.1.0"
description = "Contextual Error Rate (CxER) pipeline for measuring operationally-critical ASR errors in ATC communications"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
include = ["faa_cxer*"]
